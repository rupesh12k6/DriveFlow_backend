
spring.application.name=Placement_Drive_Management
server.port=${PORT:10000}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.profiles.active=dev
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

app.jwt.secret=${JWT_SECRET:PLACEMENT_DRIVE_MANAGEMENT_SYSTEM_JWT_SECRET_WITH_LONG_TEXT}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Validate connection before using it
spring.datasource.hikari.connection-test-query=SELECT 1
